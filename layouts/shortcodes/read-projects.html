{{ $role := .Get "role" }}
{{ range (where .Site.RegularPages "Section" "research") }}
    {{ if eq .Params.role $role }}
        <div class="research-card">
            {{ if .Params.image }}
            <div class="card-image-wrapper">
                <img src="{{ .RelPermalink }}{{ .Params.image }}" alt="{{ .Title }}">
            </div>
            {{ else }}
            <div class="card-no-image">
                <span class="card-no-image-label">{{ .Title }}</span>
            </div>
            {{ end }}
            <div class="card-content">
                <h3>{{ .Title }}</h3>
                <p>{{ .Params.summary }}</p>
                <a href="{{ .RelPermalink }}" class="read-more">Learn More &rarr;</a>
            </div>
        </div>
    {{ end }}
{{ end }}
